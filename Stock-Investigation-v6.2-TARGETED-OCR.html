<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Investigation">
<title>Stock Investigation</title>
<!-- FWWS investigation workflow v6.2: targeted FWWS description OCR 2026-09-25 -->
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202b;background:#f3f6f8}
*{box-sizing:border-box}body{margin:0;background:#f3f6f8}header{background:#fff;padding:22px 16px 16px;border-bottom:1px solid #d8dee5;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:28px}main{padding:12px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid #d4dbe2;border-radius:16px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:19px;margin:0;padding:14px 16px;background:#e9eff5}.pad{padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd4dc;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}.photoBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.photoBtn{min-height:58px;border:0;border-radius:12px;font-size:16px;font-weight:900;background:#1976d2;color:#fff}.photoBtn.import{background:#445b73}
.preview{display:none;width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#eef2f5;margin:8px 0}.ocrStatus{font-size:13px;color:#68727d;text-align:center;min-height:18px}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.reason{min-height:44px;border:1px solid #cbd4dc;background:#fff;border-radius:10px;font-weight:800}.reason.on{background:#17202b;color:#fff;border-color:#17202b}
.primary,.publish,.reset{width:100%;min-height:52px;border:0;border-radius:12px;font-size:16px;font-weight:900}.primary{background:#17823b;color:#fff;margin-top:12px}.publish{background:#1976d2;color:#fff}.reset{background:#ffe9e9;color:#a71919;margin-top:8px}
.entry{padding:12px 14px;border-top:1px solid #e2e7eb}.entry:first-child{border-top:0}.entryTitle{font-weight:900;font-size:17px}.meta{font-size:14px;line-height:1.5;margin-top:4px}.diffneg{color:#c62828;font-weight:900}.diffpos{color:#17823b;font-weight:900}.entryBtns{display:flex;gap:7px;margin-top:8px}.entryBtns button{border:0;border-radius:9px;padding:8px 12px;font-weight:800}.edit{background:#edf1f5}.delete{background:#ffe9e9;color:#a71919}
.empty{padding:18px;text-align:center;color:#68727d}.store{padding:12px 16px}.store input{max-width:140px}
.note{font-size:12px;color:#68727d;margin:8px 0 0}.hidden{display:none}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.photoBtns{grid-template-columns:1fr 1fr}.reasons{grid-template-columns:1fr 1fr}}

.review{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.review span{background:#e8f4ff;border:1px solid #b9d9f6;border-radius:8px;padding:7px;font-size:12px;font-weight:800}
.flag{padding:10px;border-radius:10px;margin-top:10px;font-weight:900}.flag.high{background:#ffe4e4;color:#a71919}.flag.ok{background:#e9f7ed;color:#176c31}
.checkline{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800}.checkline input{width:auto;transform:scale(1.3)}
@media(max-width:420px){.review{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Stock Investigation</h1></header>
<main>
<section class="card">
<h2>Report</h2>
<div class="store"><label for="store">Store number</label><input id="store" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1022"></div>
</section>

<section class="card">
<h2>Photo capture</h2>
<div class="pad">
<div class="photoBtns">
<button class="photoBtn" id="takeBtn">📷 TAKE PHOTO</button>
<button class="photoBtn import" id="importBtn">🖼 IMPORT PHOTO</button>
</div>
<input class="hidden" id="cameraInput" type="file" accept="image/*" capture="environment">
<input class="hidden" id="libraryInput" type="file" accept="image/*">
<img id="preview" class="preview" alt="Selected stock image"><button class="reset hidden" id="discardPhoto" type="button">DISCARD PHOTO</button>
<div class="ocrStatus" id="ocrStatus">Photo details can be reviewed before adding the item.</div>
<div class="review hidden" id="ocrReview"></div>
<p class="note">Photo reading is best-effort. Always check the populated information before saving the entry.</p>
</div>
</section>

<section class="card">
<h2>Item details</h2>
<div class="pad grid">
<div><label>Item code</label><input id="code" inputmode="numeric" placeholder="Item code"></div>
<div><label>Area</label><select id="area"><option>Ambient</option><option>Fv</option><option>Chiller</option><option>Bread</option><option>Freezer</option><option>Bakery</option><option>Meat</option><option>Conv</option><option>Milk</option><option>Other</option></select></div>
<div class="wide"><label>Item description</label><input id="desc" placeholder="Description"></div>
<div><label>Case size (p/c)</label><input id="pc" inputmode="numeric" placeholder="1" value="1"></div>
<div><label>SHC</label><input id="shc" inputmode="numeric" placeholder="0"></div>
<div><label>Stock quantity — Cases</label><input id="fileCases" inputmode="numeric" placeholder="0"></div>
<div><label>Stock quantity — Units</label><input id="fileUnits" inputmode="numeric" placeholder="0"></div>
<div><label>Shop floor — Units</label><input id="floorUnits" inputmode="numeric" placeholder="0"></div>
<div><label>Warehouse — Units</label><input id="warehouseUnits" inputmode="numeric" placeholder="0"></div>
<div><label>Sales today — Units</label><input id="salesUnits" inputmode="numeric" placeholder="0"></div>
<div><label>Unit price £</label><input id="unitPrice" inputmode="decimal" placeholder="0.00"></div>
<div><label>HU last 5 digits</label><input id="hu" inputmode="numeric" maxlength="5" placeholder="Optional"></div>
<div class="wide"><label>Delivery history from FWWS</label><textarea id="deliveryHistory" placeholder="Wed 32 C, Thu 48 C…"></textarea></div>
<div class="wide" id="calcBox"></div>
<div class="wide"><label class="checkline"><input id="stockCorrected" type="checkbox"> Stock Corrected / acknowledged ✓</label></div>
<div class="wide"><label class="checkline"><input id="replenish" type="checkbox"> Stock found in warehouse — replenish / no investigation required</label></div>
<div class="wide"><label>Reason</label><div class="reasons" id="reasons"></div></div>
<div class="wide"><label>Notes</label><textarea id="notes" placeholder="Further information…"></textarea></div>
</div>
<div class="pad" style="padding-top:0"><button class="primary" id="add">ADD ITEM</button></div>
</section>

<section class="card"><h2>Recorded items</h2><div id="entries"></div></section>
<section class="card"><div class="pad"><button class="publish" id="publish">PUBLISH REPORT</button><button class="reset" id="reset">RESET REPORT</button></div></section>
</main>

<!-- Tesseract.js provides in-browser OCR. If unavailable, photo selection still works and fields remain manually editable. -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY='stock-investigation-v1';
const REASONS=['Not delivered','Possible theft','Delivery discrepancy','Stock file incorrect','Damaged / write-off','Unknown','Other'];
let state={store:'',items:[]}, selectedReason='Unknown', editIndex=-1;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)state=x}catch(e){}
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
$('store').value=state.store||'';
$('store').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);state.store=e.target.value;save()}
function renderReasons(){
 $('reasons').innerHTML='';
 REASONS.forEach(r=>{const b=document.createElement('button');b.className='reason'+(r===selectedReason?' on':'');b.textContent=r;b.onclick=()=>{selectedReason=r;renderReasons()};$('reasons').appendChild(b)})
}
function num(id){const v=$(id).value.trim();return v===''?0:Number(v)}
function physical(it){return (Number(it.floorUnits)||0)+(Number(it.warehouseUnits)||0)}
function systemUnits(it){const pc=(it.area==='Meat'||it.area==='Fv')?1:Math.max(1,Number(it.pc)||1);return (Number(it.fileCases)||0)*pc+(Number(it.fileUnits)||0)}
function physical(it){return (Number(it.floorUnits)||0)+(Number(it.warehouseUnits)||0)}
function variance(it){return physical(it)-systemUnits(it)}
function valueVariance(it){return Math.abs(variance(it))*(Number(it.unitPrice)||0)}
function needsInvestigation(it){const pc=(it.area==='Meat'||it.area==='Fv')?1:Math.max(1,Number(it.pc)||1);return Math.abs(variance(it))>pc}
function updateCalc(){
 const it={area:$('area').value,pc:num('pc'),fileCases:num('fileCases'),fileUnits:num('fileUnits'),floorUnits:num('floorUnits'),warehouseUnits:num('warehouseUnits'),unitPrice:num('unitPrice')};
 const d=variance(it),v=valueVariance(it),high=Math.abs(d)>=20||v>=50,need=needsInvestigation(it);
 $('calcBox').innerHTML=`<div class="flag ${high?'high':'ok'}">FWWS ${systemUnits(it)} U → Counted ${physical(it)} U → ${Math.abs(d)} U ${d<0?'missing':d>0?'higher':'difference'} · £${v.toFixed(2)}${high?' · HIGH PRIORITY':''}${need?' · FURTHER INVESTIGATION REQUIRED':''}</div>`;
}
['area','pc','fileCases','fileUnits','floorUnits','warehouseUnits','unitPrice'].forEach(id=>$(id).addEventListener('input',updateCalc));
function discardPhoto(){const p=$('preview');if(p.src&&p.src.startsWith('blob:'))URL.revokeObjectURL(p.src);p.style.display='none';p.removeAttribute('src');$('discardPhoto').classList.add('hidden');$('cameraInput').value='';$('libraryInput').value='';$('ocrStatus').textContent='Photo details can be reviewed before adding the item.'}
function clearForm(){['code','desc','fileCases','fileUnits','floorUnits','warehouseUnits','shc','salesUnits','unitPrice','hu','deliveryHistory','notes'].forEach(x=>$(x).value='');$('pc').value='1';$('stockCorrected').checked=false;$('replenish').checked=false;$('ocrReview').classList.add('hidden');$('ocrReview').innerHTML='';selectedReason='Unknown';editIndex=-1;$('add').textContent='ADD ITEM';discardPhoto();renderReasons()}
function render(){
 const box=$('entries');box.innerHTML='';
 if(!state.items.length){box.innerHTML='<div class="empty">No suspicious stock recorded yet.</div>';return}
 state.items.forEach((it,i)=>{
  const d=physical(it)-systemUnits(it);
  const el=document.createElement('div');el.className='entry';
  el.innerHTML=`<div class="entryTitle">${esc(it.code||'No code')} — ${esc(it.desc||'No description')}</div>
  <div class="meta">${esc(it.area)}<br>Stock quantity: ${it.fileCases||0} C ${it.fileUnits||0} U &nbsp; Physical: ${physical(it)} U &nbsp; Difference: <span class="${d<0?'diffneg':d>0?'diffpos':''}">${d>0?'+':''}${d} U</span><br>£ variance: £${valueVariance(it).toFixed(2)}${(Math.abs(d)>=20||valueVariance(it)>=50)?' · <b>HIGH PRIORITY</b>':''}${needsInvestigation(it)?' · <b>FURTHER INVESTIGATION</b>':''}${it.stockCorrected?' · ✓ Stock corrected':''}${it.hu?' · HU '+esc(it.hu):''}<br>Reason: <b>${esc(it.reason)}</b>${it.deliveryHistory?'<br>Delivery: '+esc(it.deliveryHistory):''}${it.notes?'<br>Notes: '+esc(it.notes):''}</div>
  <div class="entryBtns"><button class="edit">Edit</button><button class="delete">Delete</button></div>`;
  el.querySelector('.edit').onclick=()=>editItem(i);el.querySelector('.delete').onclick=()=>{if(confirm('Delete this item?')){state.items.splice(i,1);save();render()}};
  box.appendChild(el)
 })
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function editItem(i){const it=state.items[i];editIndex=i;$('code').value=it.code;$('desc').value=it.desc;$('area').value=it.area;$('pc').value=it.pc||1;$('shc').value=it.shc||0;$('fileCases').value=it.fileCases||0;$('fileUnits').value=it.fileUnits||0;$('floorUnits').value=it.floorUnits||0;$('warehouseUnits').value=it.warehouseUnits||0;$('salesUnits').value=it.salesUnits||0;$('unitPrice').value=it.unitPrice||'';$('hu').value=it.hu||'';$('deliveryHistory').value=it.deliveryHistory||'';$('stockCorrected').checked=!!it.stockCorrected;$('replenish').checked=!!it.replenish;$('notes').value=it.notes;updateCalc();selectedReason=it.reason;$('add').textContent='SAVE CHANGES';renderReasons();scrollTo({top:$('code').getBoundingClientRect().top+scrollY-120,behavior:'smooth'})}
$('add').onclick=()=>{
 const it={code:cleanCode($('code').value.trim()),desc:$('desc').value.trim(),area:$('area').value,pc:num('pc')||1,shc:num('shc'),fileCases:num('fileCases'),fileUnits:num('fileUnits'),floorUnits:num('floorUnits'),warehouseUnits:num('warehouseUnits'),salesUnits:num('salesUnits'),unitPrice:num('unitPrice'),hu:$('hu').value.trim(),deliveryHistory:$('deliveryHistory').value.trim(),stockCorrected:$('stockCorrected').checked,replenish:$('replenish').checked,reason:selectedReason,notes:$('notes').value.trim(),savedAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 if(!it.code&&!it.desc){alert('Enter an item code or description.');return} if(it.code&&!/^\d{5,8}$/.test(it.code)){alert('Check the item code.');return} if(editIndex<0&&it.code&&state.items.some(x=>x.code===it.code)&&!confirm('This item code is already on the report. Add it again?'))return
 if(editIndex>=0)state.items[editIndex]=it;else state.items.push(it);save();render();clearForm()
};
async function handlePhoto(file){
 if(!file)return;
 discardPhoto();const url=URL.createObjectURL(file);$('preview').src=url;$('preview').style.display='block';$('discardPhoto').classList.remove('hidden');
 $('ocrStatus').textContent='Reading photo…';
 if(!window.Tesseract){$('ocrStatus').textContent='Photo selected. Automatic reading is unavailable — enter the details manually.';return}
 try{
  const result=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent='Reading FWWS… '+Math.round((m.progress||0)*70)+'%'}});
  const text=(result.data&&result.data.text)||'';
  extract(text);
  $('ocrStatus').textContent='Reading product name…';
  try{
    const bmp=await createImageBitmap(file);
    const c=document.createElement('canvas'),ctx=c.getContext('2d');
    // FWWS product description is always in the upper-right of the white Item Information panel.
    // Relative crop makes it work at different photo resolutions.
    const sx=Math.round(bmp.width*0.48), sy=Math.round(bmp.height*0.245);
    const sw=Math.round(bmp.width*0.36), sh=Math.round(bmp.height*0.095);
    c.width=sw*2;c.height=sh*2;
    ctx.filter='grayscale(1) contrast(1.8)';
    ctx.drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);
    const nr=await Tesseract.recognize(c,'eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent='Reading product name… '+(70+Math.round((m.progress||0)*30))+'%'}});
    let nt=((nr.data&&nr.data.text)||'').replace(/\s+/g,' ').trim();
    // Remove only known structural text/numbers from the name crop, not arbitrary trailing letters.
    nt=nt.replace(/^#?\s*0*\d{4,8}\s*/,'')
         .replace(/\b\d+\s*p\/c\b.*$/i,'')
         .replace(/\b\d+(?:[.,]\d{1,2})?\s*\(unit price\).*$/i,'')
         .trim();
    if(nt && /[A-Za-z]{2}/.test(nt) && nt.length<=60){
      const limited=/\(limited offer\)$/i.test($('desc').value);
      $('desc').value=nt+(limited&&!/\(limited offer\)$/i.test(nt)?' (Limited Offer)':'');
    }
    if(bmp.close)bmp.close();
  }catch(nameErr){}
  refreshOCRReview();
  $('ocrStatus').textContent='Photo read. Check the details below before adding the item.';
 }catch(e){$('ocrStatus').textContent='Could not read this photo. You can still enter the details manually.'}
}
function cleanCode(v){v=String(v||'').replace(/\D/g,'');return v.replace(/^0+/,'')||'0'}
function refreshOCRReview(){
 const fields=[['Code',$('code').value],['Name',$('desc').value],['Area',$('area').value],['p/c',$('pc').value],['Stock',`${$('fileCases').value||0} C ${$('fileUnits').value||0} U`],['SHC',$('shc').value],['Sales',$('salesUnits').value],['Price',$('unitPrice').value?('£'+$('unitPrice').value):''],['Advertising',$('ocrReview').dataset.advertising||'Regular']];
 $('ocrReview').innerHTML=fields.filter(x=>x[1]!==''&&x[1]!=null).map(x=>`<span>${x[0]}: ${esc(x[1])}</span>`).join('');
 $('ocrReview').classList.remove('hidden');
}
function extract(text){
 const lines=text.split(/\n/).map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const raw=lines.join(' ');

 // ITEM CODE: read the FWWS code then discard leading zeroes only.
 let cm=raw.match(/#?\s*(0\d{5,7})\b/);
 if(cm)$('code').value=cleanCode(cm[1]);

 // DESCRIPTION: FWWS always places it beside the item code at the top.
 // Prefer a line containing the code + following words; otherwise use the first clean product-like line near the top.
 let desc='';
 const bad=/(FWWS|store|item information|delivery|backstock|sales|stock quantity|status|comment|order areas|aisle|SHC|case size|advertising|position|DD|EP|github|details below|always check)/i;
 let ci=cm?lines.findIndex(x=>x.includes(cm[1])):-1;
 if(ci>=0){
   const nearby=lines.slice(Math.max(0,ci-2),Math.min(lines.length,ci+2));
   const clean=nearby.filter(x=>/[A-Za-z]{3}/.test(x)&&!bad.test(x)&&!x.includes(cm[1])&&!/\d{2}:\d{2}/.test(x));
   if(clean.length)desc=clean[clean.length-1].replace(/^.*?[:|]\s*/,'').replace(/\b\d+\s*p\/c\b.*$/i,'').trim();
 }
 if(!desc){
   desc=lines.slice(0,10).find(x=>/[A-Za-z]{3}/.test(x)&&!bad.test(x)&&!/\d{2}:\d{2}/.test(x)&&!(cm&&x.includes(cm[1])))||'';
   desc=desc.replace(/^#?\s*0*\d{5,7}\s*/,'').replace(/\b\d+\s*p\/c\b.*$/i,'').trim();
 }
 if(desc&&desc.length<=60){desc=desc.replace(/\s+[A-Z]{1,3}$/,'').trim();$('desc').value=desc;}

 // p/c: top line beneath description is the actual case size.
 let pm=raw.match(/\b(\d+)\s*p\/c\b/i); if(pm)$('pc').value=pm[1];

 // STOCK QUANTITY: preserve cases and units separately.
 let sm=raw.match(/stock\s*quantity[\s:.-]*(-?\d+)\s*C(?:ases?)?\s*[-: ]*([0-9Oo])\s*U(?:nits?)?/i) || raw.match(/stock\s*quantity[\s:.-]*(-?\d+)\s*C\s*[-: ]*([0-9Oo])\s*U/i);
 if(sm){$('fileCases').value=sm[1];$('fileUnits').value=/[Oo]/.test(sm[2])?0:sm[2]}

 // ORDER AREA: only the value immediately after Order areas controls the app area.
 let am=raw.match(/order\s*areas?\s*[:.-]?\s*(M\s*&\s*P|F\s*&\s*V|AMBIENT|CHILLER|FREEZER|BAKERY|BREAD|CONV|MILK)\b/i);
 if(am){
   const a=am[1].toUpperCase().replace(/\s/g,'');
   const map={'M&P':'Meat','F&V':'Fv','AMBIENT':'Ambient','CHILLER':'Chiller','FREEZER':'Freezer','BAKERY':'Bakery','BREAD':'Bread','CONV':'Conv','MILK':'Milk'};
   if(map[a])$('area').value=map[a];
 }

 let sh=raw.match(/\bSHC\s*[:.-]?\s*(\d+)\s*[CU]?/i);if(sh)$('shc').value=sh[1];
 let sa=raw.match(/\bSales\s*[:.-]?\s*(\d+)\s*U\b/i);if(sa)$('salesUnits').value=sa[1];
 let pr=raw.match(/(?:£|GBP)\s*(\d+(?:[.,]\d{1,2})?)/i);if(pr)$('unitPrice').value=pr[1].replace(',','.');
 let ad=raw.match(/advertising\s*date\s*[:.-]?\s*(--|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i);
 if(ad && ad[1] !== '--' && $('desc').value && !/\(limited offer\)$/i.test($('desc').value)) $('desc').value=$('desc').value+' (Limited Offer)';
 const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], found=[];
 days.forEach(d=>{const rx=new RegExp('\\b'+d+'\\b\\s*[:.-]?\\s*(\\d+)','i'),mm=raw.match(rx);if(mm)found.push(d+' '+mm[1]+' C')});
 if(found.length)$('deliveryHistory').value=found.join(', ');
 $('ocrReview').dataset.advertising=(ad&&ad[1]!=='--')?ad[1]:'Regular';
 refreshOCRReview();updateCalc();

 // Delivery evidence: capture labelled weekday quantities when OCR returns them in sequence.
 const dm=raw.match(/Delivery\s*\(C\).*?(Mon|Tue|Wed|Thu|Fri|Sat|Sun).*?(?:Order areas|Backstock|Sales|Stock quantity)/i);
 if(dm && !$('notes').value)$('notes').value='FWWS photo read — check delivery figures against photo before saving.';
}
$('discardPhoto').onclick=discardPhoto;
$('takeBtn').onclick=()=>$('cameraInput').click();
$('importBtn').onclick=()=>$('libraryInput').click();
$('cameraInput').onchange=e=>handlePhoto(e.target.files[0]);
$('libraryInput').onchange=e=>handlePhoto(e.target.files[0]);
$('publish').onclick=async()=>{
 if(!state.items.length){alert('No items recorded.');return}
 const lines=[(state.store||'')+(state.store?' – ':'')+'Stock Investigation',''];
 state.items.forEach((it,i)=>{const d=physical(it)-systemUnits(it);lines.push(`${it.code||'No code'} – ${it.desc||'No description'}`,`Area: ${it.area}`,`Stock quantity: ${it.fileCases||0} C ${it.fileUnits||0} U`,`Physical count: ${physical(it)} U`,`Difference: ${d>0?'+':''}${d}`,`Reason: ${it.reason}`);if(it.notes)lines.push(`Notes: ${it.notes}`);if(i<state.items.length-1)lines.push('')});
 const text=lines.join('\n');
 try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);alert('Report copied.')}}catch(e){if(e.name!=='AbortError')prompt('Copy report:',text)}
};
$('reset').onclick=()=>{if(confirm('Reset the whole report?')){state={store:state.store||'',items:[]};save();render();clearForm()}};
renderReasons();render();updateCalc();
</script>

<!-- v6 investigation system enhancements -->
<style>
.v6tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}.v6tabs button{padding:9px 2px;border:0;border-radius:8px;font-weight:800}
.v6panel{padding:10px}.v6metric{font-size:20px;font-weight:900}.v6small{font-size:12px;color:#68727d}
</style>
<script>
(function(){
 const V6='stock-investigation-v6-meta';
 let meta={claims:{},locations:{},theftRisk:{},actions:{},audit:[],relations:{}};
 try{meta={...meta,...JSON.parse(localStorage.getItem(V6)||'{}')}}catch(e){}
 const ms=()=>localStorage.setItem(V6,JSON.stringify(meta));
 const oldAdd=document.getElementById('add');
 if(oldAdd)oldAdd.addEventListener('click',()=>setTimeout(()=>{
   try{
    const code=(document.getElementById('code').value||'').replace(/^0+/,'');
    if(code)meta.audit.push({at:new Date().toISOString(),code,event:'record saved'});
    ms();
   }catch(e){}
 },0));
 // Persistent backup controls and operational tabs
 const main=document.querySelector('main'), sec=document.createElement('section');sec.className='card';
 sec.innerHTML=`<h2>Investigation system</h2><div class="v6panel">
 <div class="v6tabs"><button id="vToday">Today</button><button id="vActive">Active</button><button id="vHistory">History</button><button id="vTrends">Trends</button></div>
 <div id="v6out" class="v6small">Use Today for the walk. Active keeps unresolved work. History and Trends build from saved records.</div>
 <div class="grid" style="margin-top:10px">
 <div><label>Next action</label><select id="vAction"><option>Investigate</option><option>Check delivery</option><option>Find HU</option><option>Claim required</option><option>Waiting claim outcome</option><option>Recheck after Day End</option><option>None</option></select></div>
 <div><label>Claim outcome</label><select id="vClaim"><option>Not assessed</option><option>Eligible</option><option>Submitted</option><option>Waiting</option><option>Accepted</option><option>Partially Accepted</option><option>Rejected</option></select></div>
 <div><label>Claimed £</label><input id="vClaimed" inputmode="decimal"></div><div><label>Recovered £</label><input id="vRecovered" inputmode="decimal"></div>
 <div><label>Location / section</label><input id="vLocation"></div><div><label>Related item code</label><input id="vRelated" inputmode="numeric"></div>
 </div>
 <label class="checkline"><input id="vTheft" type="checkbox"> Theft Risk watchlist (manual)</label>
 <div class="grid" style="margin-top:10px"><button class="publish" id="vBackup">EXPORT BACKUP</button><button class="publish" id="vImport">IMPORT BACKUP</button></div>
 <input class="hidden" type="file" id="vFile" accept="application/json">
 </div>`;
 main.appendChild(sec);
 function items(){try{return JSON.parse(localStorage.getItem('stock-investigation-v1')||'{}').items||[]}catch(e){return[]}}
 function d(i){return (Number(i.counted)||0)-(Number(i.fileStock)||0)}
 function show(kind){
   let a=items(),o=document.getElementById('v6out');
   if(kind==='Today')a=a.filter(i=>new Date(i.savedAt||i.updatedAt||0).toDateString()===new Date().toDateString());
   if(kind==='Active')a=a.filter(i=>!['Accepted','Partially Accepted','Rejected'].includes((meta.claims[i.code]||{}).status));
   if(kind==='History')a=a.filter(i=>['Accepted','Partially Accepted','Rejected'].includes((meta.claims[i.code]||{}).status));
   if(kind==='Trends'){
     let g={};a.forEach(i=>{let x=g[i.code]||(g[i.code]={n:0,short:0});x.n++;if(d(i)<0)x.short++});
     o.innerHTML=Object.entries(g).sort((a,b)=>b[1].n-a[1].n).map(([c,x])=>`<b>${c}</b>: ${x.n} records · ${x.short} shortages`).join('<br>')||'No trend data yet.';return;
   }
   o.innerHTML=`<span class="v6metric">${a.length}</span> ${kind.toLowerCase()} records`+(a.length?'<br>'+a.map(i=>`${i.code} — ${i.desc||''}`).join('<br>'):'');
 }
 ['Today','Active','History','Trends'].forEach(k=>document.getElementById('v'+k).onclick=()=>show(k));
 function currentCode(){return (document.getElementById('code').value||'').replace(/\D/g,'').replace(/^0+/,'')}
 ['vAction','vClaim','vClaimed','vRecovered','vLocation','vTheft','vRelated'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{
   let c=currentCode();if(!c)return;
   meta.actions[c]=document.getElementById('vAction').value;
   meta.claims[c]={status:document.getElementById('vClaim').value,claimed:Number(document.getElementById('vClaimed').value)||0,recovered:Number(document.getElementById('vRecovered').value)||0};
   meta.locations[c]=document.getElementById('vLocation').value;
   meta.theftRisk[c]=document.getElementById('vTheft').checked;
   let r=(document.getElementById('vRelated').value||'').replace(/\D/g,'').replace(/^0+/,'');if(r)meta.relations[c]=r;
   meta.audit.push({at:new Date().toISOString(),code:c,event:'investigation metadata updated'});ms();
 }));
 document.getElementById('vBackup').onclick=()=>{
   const payload={version:6,exportedAt:new Date().toISOString(),stock:JSON.parse(localStorage.getItem('stock-investigation-v1')||'{}'),meta};
   let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='stock-investigation-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
 };
 document.getElementById('vImport').onclick=()=>document.getElementById('vFile').click();
 document.getElementById('vFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.stock||!x.meta)throw 0;if(confirm('Replace current data with this backup?')){localStorage.setItem('stock-investigation-v1',JSON.stringify(x.stock));localStorage.setItem(V6,JSON.stringify(x.meta));location.reload()}}catch(e){alert('Invalid backup')}};r.readAsText(f)};
 show('Today');
})();
</script>
</body></html>
