<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Investigation">
<title>Stock Investigation</title>
<!-- FWWS investigation workflow v8: 2026-09-25 — targeted field OCR and missing-value validation -->
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202b;background:#f3f6f8}
*{box-sizing:border-box}body{margin:0;background:#f3f6f8}header{background:#fff;padding:22px 16px 16px;border-bottom:1px solid #d8dee5;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:28px}main{padding:12px;max-width:760px;margin:auto}.card{background:#fff;border:1px solid #d4dbe2;border-radius:16px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:19px;margin:0;padding:14px 16px;background:#e9eff5}.pad{padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd4dc;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}.photoBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.photoBtn{min-height:58px;border:0;border-radius:12px;font-size:16px;font-weight:900;background:#1976d2;color:#fff}.photoBtn.import{background:#445b73}
.preview{display:none;width:100%;max-height:240px;object-fit:contain;border-radius:12px;background:#eef2f5;margin:8px 0}.ocrStatus{font-size:13px;color:#68727d;text-align:center;min-height:18px}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.reason{min-height:44px;border:1px solid #cbd4dc;background:#fff;border-radius:10px;font-weight:800}.reason.on{background:#17202b;color:#fff;border-color:#17202b}
.primary,.publish,.reset{width:100%;min-height:52px;border:0;border-radius:12px;font-size:16px;font-weight:900}.primary{background:#17823b;color:#fff;margin-top:12px}.publish{background:#1976d2;color:#fff}.reset{background:#ffe9e9;color:#a71919;margin-top:8px}
.entry{padding:12px 14px;border-top:1px solid #e2e7eb}.entry:first-child{border-top:0}.entryTitle{font-weight:900;font-size:17px}.meta{font-size:14px;line-height:1.5;margin-top:4px}.diffneg{color:#c62828;font-weight:900}.diffpos{color:#17823b;font-weight:900}.entryBtns{display:flex;gap:7px;margin-top:8px}.entryBtns button{border:0;border-radius:9px;padding:8px 12px;font-weight:800}.edit{background:#edf1f5}.delete{background:#ffe9e9;color:#a71919}
.empty{padding:18px;text-align:center;color:#68727d}.store{padding:12px 16px}.store input{max-width:140px}
.note{font-size:12px;color:#68727d;margin:8px 0 0}.hidden{display:none}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.photoBtns{grid-template-columns:1fr 1fr}.reasons{grid-template-columns:1fr 1fr}}

.review.hidden{display:none}.review{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.review span{background:#e8f4ff;border:1px solid #b9d9f6;border-radius:8px;padding:7px;font-size:12px;font-weight:800}
.flag{padding:10px;border-radius:10px;margin-top:10px;font-weight:900}.flag.high{background:#ffe4e4;color:#a71919}.flag.pending{background:#fff3d6;color:#735100}.flag.ok{background:#e9f7ed;color:#176c31}
.checkline{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800}.checkline input{width:auto;transform:scale(1.3)}
@media(max-width:420px){.review{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Stock Investigation</h1></header>
<main>
<section class="card">
<h2>Report</h2>
<div class="store"><label for="store">Store number</label><input id="store" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1022"></div>
</section>

<section class="card">
<h2>Photo capture</h2>
<div class="pad">
<div class="photoBtns">
<button class="photoBtn" id="takeBtn">📷 TAKE PHOTO</button>
<button class="photoBtn import" id="importBtn">🖼 IMPORT PHOTO</button>
</div>
<input class="hidden" id="cameraInput" type="file" accept="image/*" capture="environment">
<input class="hidden" id="libraryInput" type="file" accept="image/*">
<img id="preview" class="preview" alt="Selected stock image"><button class="reset hidden" id="discardPhoto" type="button">DISCARD PHOTO</button>
<div class="ocrStatus" id="ocrStatus">Photo details can be reviewed before adding the item.</div>
<div class="review hidden" id="ocrReview"></div>
<p class="note">Photo reading is best-effort. Always check the populated information before saving the entry.</p>
</div>
</section>

<section class="card">
<h2>Item details</h2>
<div class="pad grid">
<div><label>Item code</label><input id="code" inputmode="numeric" placeholder="Item code"></div>
<div><label>Area</label><select id="area"><option value="">Select area</option><option>Ambient</option><option>Fv</option><option>Chiller</option><option>Bread</option><option>Freezer</option><option>Bakery</option><option>Meat</option><option>Conv</option><option>Milk</option><option>Non Food</option><option>Plants and Flowers</option><option>Other</option></select></div>
<div class="wide"><label>Item description</label><input id="desc" placeholder="Description"></div>
<div><label>Backstock</label><input id="backstock" placeholder="-- / 2 C"></div>
<div><label>Pack size (p/c or kg/c)</label><input id="pc" inputmode="numeric" placeholder="Not read"></div>
<div><label>Quantity basis</label><select id="measure"><option value="U">Units</option><option value="kg">Kilograms</option></select></div>
<div><label>Stock quantity — Cases</label><input id="fileCases" inputmode="numeric" placeholder="Enter value"></div>
<div><label>Stock quantity — Loose units / kg</label><input id="fileUnits" inputmode="numeric" placeholder="Enter value"></div>
<div><label>Shop floor — Units / kg</label><input id="floorUnits" inputmode="numeric" placeholder="Enter value"></div>
<div><label>Warehouse — Units / kg</label><input id="warehouseUnits" inputmode="numeric" placeholder="Enter value"></div>
<div><label>Sales today — Units</label><input id="salesUnits" inputmode="numeric" placeholder="Enter value"></div>
<div><label>Unit price £</label><input id="unitPrice" inputmode="decimal" placeholder="Not read"></div>
<div><label>HU last 5 digits</label><input id="hu" inputmode="numeric" maxlength="5" placeholder="Optional"></div>
<div class="wide"><label>Delivery history from FWWS</label><textarea id="deliveryHistory" placeholder="Wed 32 C, Thu 48 C…"></textarea></div>
<div class="wide" id="calcBox"></div>
<div class="wide"><label class="checkline"><input id="stockCorrected" type="checkbox"> Stock Corrected / acknowledged ✓</label></div>
<div class="wide"><label class="checkline"><input id="replenish" type="checkbox"> Stock found in warehouse — replenish / no investigation required</label></div>
<div class="wide"><label>Reason</label><div class="reasons" id="reasons"></div></div>
<div class="wide"><label>Notes</label><textarea id="notes" placeholder="Further information…"></textarea></div>
</div>
<div class="pad" style="padding-top:0"><button class="primary" id="add">ADD ITEM</button></div>
</section>

<section class="card"><h2>Recorded items</h2><div id="entries"></div></section>
<section class="card"><div class="pad"><button class="publish" id="publish">PUBLISH REPORT</button><button class="reset" id="reset">RESET REPORT</button></div></section>
</main>

<!-- Tesseract.js provides in-browser OCR. If unavailable, photo selection still works and fields remain manually editable. -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script>
<script>
const KEY='stock-investigation-v1';
const REASONS=['Not delivered','Possible theft','Delivery discrepancy','Stock file incorrect','Damaged / write-off','Unknown','Other'];
let state={store:'',items:[]}, selectedReason='Unknown', editIndex=-1;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)state=x}catch(e){}
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
$('store').value=state.store||'';
$('store').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);state.store=e.target.value;save()}
function renderReasons(){
 $('reasons').innerHTML='';
 REASONS.forEach(r=>{const b=document.createElement('button');b.className='reason'+(r===selectedReason?' on':'');b.textContent=r;b.onclick=()=>{selectedReason=r;renderReasons()};$('reasons').appendChild(b)})
}
function num(id){const v=$(id).value.trim();return v===''?null:Number(v)}
function packSize(it){return it.measure==='kg'?Number(it.pc):(it.area==='Meat'||it.area==='Fv')?1:Number(it.pc)}
function systemUnits(it){const pc=packSize(it);return (Number(it.fileCases)||0)*pc+(Number(it.fileUnits)||0)}
function physical(it){return (Number(it.floorUnits)||0)+(Number(it.warehouseUnits)||0)}
function variance(it){return physical(it)-systemUnits(it)}
function valueVariance(it){return Math.abs(variance(it))*(Number(it.unitPrice)||0)}
function needsInvestigation(it){const pc=packSize(it);return Math.abs(variance(it))>pc}
function updateCalc(){
 const it={area:$('area').value,measure:$('measure').value,pc:num('pc'),fileCases:num('fileCases'),fileUnits:num('fileUnits'),floorUnits:num('floorUnits'),warehouseUnits:num('warehouseUnits'),unitPrice:num('unitPrice')};
 if(!it.area||['pc','fileCases','fileUnits','floorUnits','warehouseUnits','unitPrice'].some(id=>$(id).value.trim()===''||!Number.isFinite(num(id)))||it.pc<=0){$('calcBox').innerHTML='<div class="flag pending">Complete Area, pack size, stock, physical counts and price to calculate. Enter 0 only when confirmed.</div>';return}
 const d=variance(it),v=valueVariance(it),high=(it.measure!=='kg'&&Math.abs(d)>=20)||v>=50,need=needsInvestigation(it);
 $('calcBox').innerHTML=`<div class="flag ${high?'high':'ok'}">FWWS ${systemUnits(it)} ${it.measure} → Counted ${physical(it)} ${it.measure} → ${Math.abs(d)} ${it.measure} ${d<0?'missing':d>0?'higher':'difference'} · £${v.toFixed(2)}${high?' · HIGH PRIORITY':''}${need?' · FURTHER INVESTIGATION REQUIRED':''}</div>`;
}
['area','measure','pc','fileCases','fileUnits','floorUnits','warehouseUnits','unitPrice'].forEach(id=>$(id).addEventListener('input',updateCalc));
function discardPhoto(){const p=$('preview');if(p.src&&p.src.startsWith('blob:'))URL.revokeObjectURL(p.src);p.style.display='none';p.removeAttribute('src');$('discardPhoto').classList.add('hidden');$('cameraInput').value='';$('libraryInput').value='';$('ocrStatus').textContent='Photo details can be reviewed before adding the item.'}
function clearForm(){$('area').value='';$('measure').value='U';['code','desc','backstock','fileCases','fileUnits','floorUnits','warehouseUnits','salesUnits','unitPrice','hu','deliveryHistory','notes'].forEach(x=>$(x).value='');$('pc').value='';$('stockCorrected').checked=false;$('replenish').checked=false;$('ocrReview').classList.add('hidden');$('ocrReview').innerHTML='';selectedReason='Unknown';editIndex=-1;$('add').textContent='ADD ITEM';discardPhoto();renderReasons();updateCalc()}
function render(){
 const box=$('entries');box.innerHTML='';
 if(!state.items.length){box.innerHTML='<div class="empty">No suspicious stock recorded yet.</div>';return}
 state.items.forEach((it,i)=>{
  const d=physical(it)-systemUnits(it);
  const el=document.createElement('div');el.className='entry';
  el.innerHTML=`<div class="entryTitle">${esc(it.code||'No code')} — ${esc(it.desc||'No description')}</div>
  <div class="meta">${esc(it.area)}<br>Stock quantity: ${it.fileCases||0} C ${it.fileUnits??0} ${it.measure||'U'} &nbsp; Physical: ${physical(it)} ${it.measure||'U'} &nbsp; Difference: <span class="${d<0?'diffneg':d>0?'diffpos':''}">${d>0?'+':''}${d} ${it.measure||'U'}</span><br>£ variance: £${valueVariance(it).toFixed(2)}${((it.measure!=='kg'&&Math.abs(d)>=20)||valueVariance(it)>=50)?' · <b>HIGH PRIORITY</b>':''}${needsInvestigation(it)?' · <b>FURTHER INVESTIGATION</b>':''}${it.stockCorrected?' · ✓ Stock corrected':''}${it.hu?' · HU '+esc(it.hu):''}<br>Reason: <b>${esc(it.reason)}</b>${it.deliveryHistory?'<br>Delivery: '+esc(it.deliveryHistory):''}${it.notes?'<br>Notes: '+esc(it.notes):''}</div>
  <div class="entryBtns"><button class="edit">Edit</button><button class="delete">Delete</button></div>`;
  el.querySelector('.edit').onclick=()=>editItem(i);el.querySelector('.delete').onclick=()=>{if(confirm('Delete this item?')){state.items.splice(i,1);save();render()}};
  box.appendChild(el)
 })
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function editItem(i){const it=state.items[i];editIndex=i;$('code').value=it.code||'';$('desc').value=it.desc||'';$('area').value=it.area||'';$('measure').value=it.measure||'U';$('backstock').value=it.backstock||'';$('pc').value=it.pc||1;$('fileCases').value=it.fileCases??'';$('fileUnits').value=it.fileUnits??'';$('floorUnits').value=it.floorUnits??'';$('warehouseUnits').value=it.warehouseUnits??'';$('salesUnits').value=it.salesUnits??'';$('unitPrice').value=it.unitPrice??'';$('hu').value=it.hu||'';$('deliveryHistory').value=it.deliveryHistory||'';$('stockCorrected').checked=!!it.stockCorrected;$('replenish').checked=!!it.replenish;$('notes').value=it.notes||'';selectedReason=it.reason||'Unknown';$('add').textContent='SAVE CHANGES';renderReasons();updateCalc();scrollTo({top:$('code').getBoundingClientRect().top+scrollY-120,behavior:'smooth'})}
$('add').onclick=()=>{
 const it={code:cleanCode($('code').value.trim()),desc:$('desc').value.trim(),area:$('area').value,measure:$('measure').value,backstock:$('backstock').value.trim(),pc:num('pc'),fileCases:num('fileCases'),fileUnits:num('fileUnits'),floorUnits:num('floorUnits'),warehouseUnits:num('warehouseUnits'),salesUnits:num('salesUnits'),unitPrice:num('unitPrice'),hu:$('hu').value.replace(/\D/g,'').slice(-5),deliveryHistory:$('deliveryHistory').value.trim(),stockCorrected:$('stockCorrected').checked,replenish:$('replenish').checked,reason:selectedReason,notes:$('notes').value.trim(),savedAt:new Date().toISOString()};
 if(!it.code&&!it.desc){alert('Enter an item code or description.');return} if(it.code&&!/^\d{1,8}$/.test(it.code)){alert('Check the item code.');return}
 if(!it.area){alert('Select the Order Area.');$('area').focus();return}
 for(const id of ['pc','fileCases','fileUnits','floorUnits','warehouseUnits','unitPrice']){if($(id).value.trim()===''||!Number.isFinite(num(id))){alert('Enter '+({pc:'pack size',fileCases:'stock cases',fileUnits:'stock loose quantity',floorUnits:'shop floor count',warehouseUnits:'warehouse count',unitPrice:'unit price'}[id])+'. Use 0 only when confirmed.');$(id).focus();return}}
 if(it.pc<=0||it.unitPrice<0||it.floorUnits<0||it.warehouseUnits<0){alert('Check pack size, price and physical counts.');return}
 if(!Number.isInteger(it.fileCases)||(it.measure!=='kg'&&['pc','fileUnits','floorUnits','warehouseUnits'].some(id=>!Number.isInteger(num(id))))){alert('Enter whole cases and units, or select Kilograms for weight stock.');return}
 if(editIndex<0&&it.code&&state.items.some(x=>x.code===it.code)){if(!confirm('This item has already been recorded today. Save another timestamped snapshot?'))return}
 if(it.replenish&&variance(it)===0){it.reason='Found in warehouse / replenish';it.noInvestigation=true}
 if(editIndex>=0)state.items[editIndex]=it;else state.items.push(it);save();render();clearForm()
};
// Field extraction uses word coordinates; screen columns are never flattened together.
function ocrWords(data){return data.words || (data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>(p.lines||[]).flatMap(l=>l.words||[])));}
function centre(w){return {x:(w.bbox.x0+w.bbox.x1)/2,y:(w.bbox.y0+w.bbox.y1)/2};}
function wordHeight(w){return Math.max(10,w.bbox.y1-w.bbox.y0);}
function ocrClean(s){return String(s||'').replace(/[–—−]/g,'-').replace(/\r/g,'').trim();}
function exactNumber(s){s=ocrClean(s).replace(/\s+/g,'');return /^-?\d+(?:[.,]\d+)?$/.test(s)?s.replace(',','.'):null;}
function knownArea(s){const v=ocrClean(s).toUpperCase().replace(/\s+/g,'').replace(/^12-/,'');return {'M&P':'Meat','F&V':'Fv','AMBIENT':'Ambient','CHILLER':'Chiller','FREEZER':'Freezer','NONFOOD':'Non Food','NON-FOOD':'Non Food','BAKERY':'Bakery','BREAD':'Bread','CONV':'Conv','MILK':'Milk','PLANTSANDFLOWERS':'Plants and Flowers'}[v]||'';}
async function readFwws(data,readRegion,width,height,progress=()=>{}){
 const words=ocrWords(data).filter(w=>w.bbox&&w.confidence>=35);
 const find=rx=>words.filter(w=>rx.test(ocrClean(w.text))).sort((a,b)=>b.confidence-a.confidence)[0];
 let delivery=find(/^Delivery$/i);const stock=find(/^Stock$/i),sales=find(/^Sales$/i),order=find(/^Order$/i),item=find(/^information$/i);
 const out={code:'',desc:'',pc:'',unitPrice:'',fileCases:'',fileUnits:'',salesUnits:'',backstock:'',area:'',deliveryHistory:'',measure:'U'};
 const initialDays=words.filter(w=>/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)$/i.test(w.text)&&w.confidence>=70).sort((a,b)=>a.bbox.x0-b.bbox.x0);
 if(!delivery&&initialDays.length===7){const d=initialDays[0],dh=wordHeight(d);delivery={text:'Delivery',confidence:90,bbox:{x0:d.bbox.x0-dh*1.4,x1:d.bbox.x1,y0:d.bbox.y0-dh*2,y1:d.bbox.y0-dh*.8}};}
 const h=delivery?wordHeight(delivery):stock?wordHeight(stock):25;
 const left=delivery?.bbox.x0??order?.bbox.x0;
 const rightCol=stock?.bbox.x0;
 const span=left!=null&&rightCol!=null?(rightCol-left)*1.95:width*.75;
 const right=Math.min(width,rightCol!=null?rightCol+span*.48:width*.94);
 function inBox(box){return words.filter(w=>{const c=centre(w);return c.x>=box.x0&&c.x<=box.x1&&c.y>=box.y0&&c.y<=box.y1}).sort((a,b)=>a.bbox.x0-b.bbox.x0);}
 async function read(box,mode='7'){
  box={x0:Math.max(0,box.x0),y0:Math.max(0,box.y0),x1:Math.min(width,box.x1),y1:Math.min(height,box.y1)};
  if(box.x1<=box.x0||box.y1<=box.y0)return [];
  const local=await readRegion(box,mode);
  const all=ocrWords(local);const ws=all.filter(w=>w.confidence>=55);
  // Never drop an uncertain word from the middle of a number or description.
  const confident=all.length&&all.every(w=>w.confidence>=55);
  return [confident?ws.map(w=>w.text).join(' ').trim():'',inBox(box).filter(w=>w.confidence>=60).map(w=>w.text).join(' ').trim()].filter(Boolean);
 }
 async function below(label,endX,parse){
  if(!label)return null;
  const lh=wordHeight(label),x=label.bbox.x0;
  const options=await read({x0:x-lh*.2,y0:label.bbox.y1+lh*.2,x1:endX,y1:label.bbox.y1+lh*3.1});
  for(const value of options){const parsed=parse(value);if(parsed!=null&&parsed!=='')return parsed;}return null;
 }
 progress('Finding item details');
 // Only the item-code column, between the title and delivery row, can supply a code.
 const candidates=words.filter(w=>/^[-#]?\d{4,8}$/.test(w.text)&&w.confidence>=65&&delivery&&centre(w).y<delivery.bbox.y0&&centre(w).y>(item?item.bbox.y1:delivery.bbox.y0-h*7)&&centre(w).x<(rightCol??width*.55));
 if(candidates.length===1&&/^[-#]?\d{7,8}$/.test(candidates[0].text))out.code=candidates[0].text.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
 if(delivery&&left!=null&&rightCol!=null){const codeReads=await read({x0:Math.max(0,left-h*.5),x1:rightCol-h*1.2,y0:Math.max(0,delivery.bbox.y0-h*6),y1:delivery.bbox.y0-h*.6},'6');for(const t of codeReads){const matches=t.match(/(?:^|\s)[-#]?(\d{7,8})(?=\s|$)/g);if(matches?.length===1){out.code=matches[0].replace(/\D/g,'').replace(/^0+(?=\d)/,'');break;}}}
 const detailWords=words.filter(w=>delivery&&centre(w).y<delivery.bbox.y0&&centre(w).y>delivery.bbox.y0-h*7&&centre(w).x>(left??0)+span*.4);
 const pack=detailWords.find(w=>/^(?:p\/?c|units?|kg\/c)$/i.test(w.text));
 const priceLabel=detailWords.find(w=>/^\(?Unit$/i.test(w.text));
 const anchor=pack||priceLabel;
 if(anchor){
  const ah=wordHeight(anchor),x0=Math.max(0,(rightCol??anchor.bbox.x0-ah*2)-ah*.8),y=centre(anchor).y;
  const options=await read({x0,y0:y-ah*1.05,x1:right,y1:y+ah*1.05});
  for(const text of options){
   const p=text.match(/\b(\d+(?:[.,]\d+)?)\s*(p\s*\/\s*c|units?\s+per\s+case|kg\s*\/\s*c)\b/i);
   const money=text.match(/\b(\d+[.,]\d{2})\s*\(?\s*Unit\s*price\s*\)?/i);
   if(p&&!out.pc){out.pc=p[1].replace(',','.');if(/^kg/i.test(p[2]))out.measure='kg';}
   if(money&&!out.unitPrice)out.unitPrice=money[1].replace(',','.');
  }
  // The description is immediately above the product detail line, in its own right-hand column.
  const names=await read({x0,y0:y-ah*3.7,x1:right,y1:y-ah*.95});
  names.sort((a,b)=>b.length-a.length);for(let name of names){name=name.replace(/^[^A-Za-z]+/,'').trim();if(/[A-Za-z]{3}/.test(name)&&name.length<=65&&!/Delivery|information|price|p\s*\/\s*c|FWWS/i.test(name)&&/^[A-Za-z0-9 &%+'’().,\/-]+$/.test(name)){out.desc=name;break;}}
 }
 progress('Reading stock and sales');
 const st=await below(stock,right,s=>{const m=ocrClean(s).match(/(?:^|\s)(-?\d+)\s*C\s*(-?[\dOo]+(?:[.,]\d+)?)\s*(U|kg)\b/i);return m?{cases:m[1],units:m[2].replace(/[Oo]/g,'0').replace(',','.'),measure:m[3].toLowerCase()==='kg'?'kg':'U'}:null});
 if(st){out.fileCases=st.cases;out.fileUnits=st.units;out.measure=st.measure;}
 const sa=await below(sales,stock?stock.bbox.x0-h*.5:right,s=>{const m=ocrClean(s).match(/^(-?\d+(?:[.,]\d+)?)\s*U$/i);return m?m[1].replace(',','.'):null;});if(sa!=null)out.salesUnits=sa;
 const back=find(/^Backstock$/i);const bs=await below(back,sales?sales.bbox.x0-h*.5:(back?back.bbox.x1:right),s=>/^(-?\d+\s*[CU])$/i.test(ocrClean(s))?ocrClean(s):null);if(bs)out.backstock=bs;
 progress('Reading Order Area');

function fwwsScreenType(data){const text=data.text||ocrWords(data).map(w=>w.text).join(' ');if(/General\s+Data/i.test(text)&&/Time\s+Series/i.test(text)){if(/C-Date|Order\s+Areas|Delivery\s+Date/i.test(text))return 'general';return 'history';}if(/Main\s+Location|CS:\s*\d+\s*Pieces/i.test(text))return 'counting';return 'classic';}
async function readGeneralFwws(data,readRegion,width,height,progress=()=>{}){

 const stock=find(/^Stock$/i),back=find(/^Backstock$/i),order=find(/^Order$/i),cs=find(/^CS$/i),price=find(/^Price$/i),cdate=find(/^C-Date$/i);
 if(!stock||!order)return result;

function enhanceField(pixels,width,height){

async function handlePhoto(file){
